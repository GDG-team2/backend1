# Render Blueprint: 대시보드에서 New > Blueprint로 이 저장소를 고르면 아래 설정으로 서버가 만들어진다.
# sync: false 항목은 Render 대시보드에서 값을 직접 입력한다(비밀값은 git에 두지 않음).
services:
  - type: web
    name: ohakkom-backend
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
