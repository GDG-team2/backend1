spring:
  application:
    name: walkmission
  datasource:
    url: jdbc:postgresql://localhost:5432/walkmission
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
