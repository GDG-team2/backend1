spring:
  application:
    name: oHaKkom
  profiles:
    # 로컬은 local(비밀값은 git에 없는 application-local.yml), 배포 서버는 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oHaKkom}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  # Render 등 호스팅은 PORT 환경변수로 포트를 알려준다
  port: ${PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret-key: ${JWT_SECRET:this_is_a_very_long_secret_key_for_local_development_only_please_change_in_production}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
